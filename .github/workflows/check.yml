# Quick sanity check on every push: every script parses and the single-file build works.
name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check every script
        run: for f in js/*.js js/*/*.js; do node --check "$f" || exit 1; done
      - name: Build single-file game
        run: python3 tools/build_single.py
