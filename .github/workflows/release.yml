# Push a tag like v2.0.0 and this builds the download-and-play zip
# and attaches it to a GitHub Release.
name: Build downloadable release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          echo "${GITHUB_REF_NAME#v}" > VERSION
          bash tools/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/cardboard-kingdom.html \
            --title "Cardboard Kingdom $GITHUB_REF_NAME" \
            --notes "Download the zip, unzip it, and double-click play.bat (Windows), play.command (macOS) or play.sh (Linux). Or just open cardboard-kingdom.html in any browser."
