<text x='89.0' y='248' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>major form. Grandma</text>
<text x='89.0' y='270' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>mails the old box.</text>
