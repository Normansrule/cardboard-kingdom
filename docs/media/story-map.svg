<text x='1011.0' y='142' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='600' fill='#7a5434' text-anchor='middle'>Campus in color</text>
<rect x='942.0' y='200' width='138' height='96' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='1011.0' y='226' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>A monster-built boat</text>
<text x='1011.0' y='248' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>sails home. Regatta,</text>
<text x='1011.0' y='270' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>Grandma's call, Rule 3.</text>
<rect x='20' y='330' width='1060' height='76' rx='12' fill='#fff4dc' stroke='#c9a77a' stroke-width='2'/>
<text x='550.0' y='360' font-family='Trebuchet MS, Verdana, sans-serif' font-size='17' font-weight='700' fill='#3d2412' text-anchor='middle'>Theme: find contentment in the world you live in, then build it a little better.</text>
<text x='550.0' y='388' font-family='Trebuchet MS, Verdana, sans-serif' font-size='14' font-weight='400' fill='#7a5434' text-anchor='middle'>Rule 1: Everybody gets a home.  Rule 2: Nobody gets left out in the rain.  Rule 3: Don't stop playing.</text>
</svg>