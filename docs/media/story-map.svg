<text x='703.6666666666666' y='226' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>TWIST: Grandma was the</text>
<text x='703.6666666666666' y='248' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>first Builder. Corvin is</text>
<text x='703.6666666666666' y='270' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>her gum-wrapper bird.</text>
<line x1='775.6666666666666' y1='125' x2='783.3333333333333' y2='125' stroke='#7a5434' stroke-width='4' marker-end='url(#ah)'/>
<rect x='788.3333333333333' y='80' width='138' height='90' rx='14' fill='#bfe6ff' stroke='#3d2412' stroke-width='3'/>
