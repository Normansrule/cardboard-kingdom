<text x='857.3333333333333' y='142' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='600' fill='#7a5434' text-anchor='middle'>The spillway</text>
<rect x='788.3333333333333' y='200' width='138' height='96' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='857.3333333333333' y='226' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>TWIST: the storm is</text>
<text x='857.3333333333333' y='248' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>Sam's discouragement.</text>
<text x='857.3333333333333' y='270' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>You can only guide it.</text>
<line x1='929.3333333333333' y1='125' x2='936.9999999999999' y2='125' stroke='#7a5434' stroke-width='4' marker-end='url(#ah)'/>
<rect x='942.0' y='80' width='138' height='90' rx='14' fill='#b8ecb0' stroke='#3d2412' stroke-width='3'/>
