<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 400' width='980' height='400' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#7a5434'/></marker></defs>
<rect width='980' height='400' rx='20' fill='#fbf1df'/>
<text x='490.0' y='40' font-family='Trebuchet MS, Verdana, sans-serif' font-size='24' font-weight='700' fill='#3d2412' text-anchor='middle'>After the credits</text>
<rect x='20.0' y='70' width='200' height='90' rx='14' fill='#b9d3e8' stroke='#3d2412' stroke-width='3'/>
<text x='120.0' y='105' font-family='Trebuchet MS, Verdana, sans-serif' font-size='19' font-weight='700' fill='#3d2412' text-anchor='middle'>Chapter 6</text>
<text x='120.0' y='132' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='600' fill='#7a5434' text-anchor='middle'>Storm Season</text>
<rect x='20.0' y='185' width='200' height='140' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='120.0' y='212' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>A storm floods campus.</text>
<text x='120.0' y='236' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>Gutter Gremlins just</text>
<text x='120.0' y='260' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>want their drain back.</text>
<text x='120.0' y='284' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>Rule 4: leave room</text>
<text x='120.0' y='308' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>for the rain.</text>
<line x1='224.0' y1='115' x2='260.6666666666667' y2='115' stroke='#7a5434' stroke-width='4' marker-end='url(#ah)'/>
<rect x='266.66666666666663' y='70' width='200' height='90' rx='14' fill='#f6d9b0' stroke='#3d2412' stroke-width='3'/>
<text x='366.66666666666663' y='105' font-family='Trebuchet MS, Verdana, sans-serif' font-size='19' font-weight='700' fill='#3d2412' text-anchor='middle'>Chapter 7</text>
<text x='366.66666666666663' y='132' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='600' fill='#7a5434' text-anchor='middle'>Paper Birds</text>
<rect x='266.66666666666663' y='185' width='200' height='140' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='366.66666666666663' y='212' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>Grandma&#39;s attic holds</text>
<text x='366.66666666666663' y='236' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>the first Kingdom.</text>
<text x='366.66666666666663' y='260' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>Corvin comes home.</text>
<text x='366.66666666666663' y='284' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>Rule 5: every stone</text>
<text x='366.66666666666663' y='308' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>leans on the next.</text>
<line x1='470.66666666666663' y1='115' x2='507.33333333333326' y2='115' stroke='#7a5434' stroke-width='4' marker-end='url(#ah)'/>
<rect x='513.3333333333333' y='70' width='200' height='90' rx='14' fill='#c9c3ee' stroke='#3d2412' stroke-width='3'/>
<text x='613.3333333333333' y='105' font-family='Trebuchet MS, Verdana, sans-serif' font-size='19' font-weight='700' fill='#3d2412' text-anchor='middle'>Chapter 8</text>
<text x='613.3333333333333' y='132' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='600' fill='#7a5434' text-anchor='middle'>Lantern Festival</text>
<rect x='513.3333333333333' y='185' width='200' height='140' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='613.3333333333333' y='212' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>Too much light hides</text>
<text x='613.3333333333333' y='236' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>the moon. Jules faces</text>
<text x='613.3333333333333' y='260' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>the dark. Grandma</text>
<text x='613.3333333333333' y='284' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>hung the moon. Rule 6:</text>
<text x='613.3333333333333' y='308' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>light the path.</text>
<line x1='717.3333333333333' y1='115' x2='753.9999999999999' y2='115' stroke='#7a5434' stroke-width='4' marker-end='url(#ah)'/>
<rect x='760.0' y='70' width='200' height='90' rx='14' fill='#cfe6ee' stroke='#3d2412' stroke-width='3'/>
<text x='860.0' y='105' font-family='Trebuchet MS, Verdana, sans-serif' font-size='19' font-weight='700' fill='#3d2412' text-anchor='middle'>Chapter 9</text>
<text x='860.0' y='132' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='600' fill='#7a5434' text-anchor='middle'>The Keeper&#39;s Light</text>
<rect x='760.0' y='185' width='200' height='140' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='860.0' y='212' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>Grandpa Ike built the</text>
<text x='860.0' y='236' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>lighthouse; he and Rosie</text>
<text x='860.0' y='260' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>built a reef. Step</text>
<text x='860.0' y='284' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>back. Rule 7: work</text>
<text x='860.0' y='308' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' font-weight='400' fill='#3d2412' text-anchor='middle'>with the water.</text>
<text x='490.0' y='370' font-family='Trebuchet MS, Verdana, sans-serif' font-size='14' font-weight='600' fill='#7a5434' text-anchor='middle'>Each chapter adds a rule to Grandma's journal, and a real engineering idea to a puzzle.</text>
</svg>