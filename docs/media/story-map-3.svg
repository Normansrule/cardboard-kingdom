<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 380' width='980' height='380' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#7a5434'/></marker></defs>
<rect width='980' height='380' rx='20' fill='#fbf1df'/>
<text x='490' y='40' font-family='Trebuchet MS, Verdana, sans-serif' font-size='24' font-weight='700' fill='#3d2412' text-anchor='middle'>Chapter 10: The Long Bridge (the finale)</text>
<rect x='20.0' y='70' width='170' height='70' rx='14' fill='#cfe8c0' stroke='#3d2412' stroke-width='3'/>
<text x='105.0' y='112' font-family='Trebuchet MS, Verdana, sans-serif' font-size='16' font-weight='700' fill='#3d2412' text-anchor='middle'>The Great Gorge</text>
<rect x='20.0' y='160' width='170' height='130' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='105.0' y='190' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>The Fair is across a</text>
<text x='105.0' y='214' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>canyon. The bridge</text>
<text x='105.0' y='238' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>washed away in</text>
<text x='105.0' y='262' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>Sam&#39;s storm.</text>
<line x1='193.0' y1='105' x2='207.5' y2='105' stroke='#7a5434' stroke-width='4' marker-end='url(#ah)'/>
<rect x='212.5' y='70' width='170' height='70' rx='14' fill='#c9cfd8' stroke='#3d2412' stroke-width='3'/>
<text x='297.5' y='112' font-family='Trebuchet MS, Verdana, sans-serif' font-size='16' font-weight='700' fill='#3d2412' text-anchor='middle'>The Little Drizzle</text>
<rect x='212.5' y='160' width='170' height='130' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='297.5' y='190' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>The last of the storm:</text>
<text x='297.5' y='214' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>&quot;you&#39;ll never finish.&quot;</text>
<text x='297.5' y='238' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>Sam doesn&#39;t beat it.</text>
<text x='297.5' y='262' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>They invite it along.</text>
<line x1='385.5' y1='105' x2='400.0' y2='105' stroke='#7a5434' stroke-width='4' marker-end='url(#ah)'/>
<rect x='405.0' y='70' width='170' height='70' rx='14' fill='#f6d9b0' stroke='#3d2412' stroke-width='3'/>
<text x='490.0' y='112' font-family='Trebuchet MS, Verdana, sans-serif' font-size='16' font-weight='700' fill='#3d2412' text-anchor='middle'>Kite and Bridge</text>
<rect x='405.0' y='160' width='170' height='130' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='490.0' y='190' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>Pip flies the first</text>
<text x='490.0' y='214' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>line across. The whole</text>
<text x='490.0' y='238' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>Kingdom builds a</text>
<text x='490.0' y='262' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>suspension bridge.</text>
<line x1='578.0' y1='105' x2='592.5' y2='105' stroke='#7a5434' stroke-width='4' marker-end='url(#ah)'/>
<rect x='597.5' y='70' width='170' height='70' rx='14' fill='#b9d3e8' stroke='#3d2412' stroke-width='3'/>
<text x='682.5' y='112' font-family='Trebuchet MS, Verdana, sans-serif' font-size='16' font-weight='700' fill='#3d2412' text-anchor='middle'>The Box Goes Soft</text>
<rect x='597.5' y='160' width='170' height='130' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='682.5' y='190' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>At the Fair, Sam fades.</text>
<text x='682.5' y='214' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>Corry&#39;s last star.</text>
<text x='682.5' y='238' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>Back home, the old</text>
<text x='682.5' y='262' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>box folds flat.</text>
<line x1='770.5' y1='105' x2='785.0' y2='105' stroke='#7a5434' stroke-width='4' marker-end='url(#ah)'/>
<rect x='790.0' y='70' width='170' height='70' rx='14' fill='#ffe08a' stroke='#3d2412' stroke-width='3'/>
<text x='875.0' y='112' font-family='Trebuchet MS, Verdana, sans-serif' font-size='16' font-weight='700' fill='#3d2412' text-anchor='middle'>Build It Again</text>
<rect x='790.0' y='160' width='170' height='130' rx='10' fill='#fffaf0' stroke='#c9a77a' stroke-width='2'/>
<text x='875.0' y='190' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>Grandma: &quot;A door isn&#39;t</text>
<text x='875.0' y='214' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>the box.&quot; A new box,</text>
<text x='875.0' y='238' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>built together.</text>
<text x='875.0' y='262' font-family='Trebuchet MS, Verdana, sans-serif' font-size='13' fill='#3d2412' text-anchor='middle'>Rule 8. FRONT ROW!</text>
<text x='490' y='335' font-family='Trebuchet MS, Verdana, sans-serif' font-size='15' font-weight='700' fill='#7a5434' text-anchor='middle'>Rule 8: Build it together, and build it again.</text>
<text x='490' y='360' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' fill='#7a5434' text-anchor='middle'>Then free roam: the new box goes anywhere in the Kingdom, and the Fair stays open all spring.</text>
</svg>