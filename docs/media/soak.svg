<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 330' width='1000' height='330' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#7a5434'/></marker></defs>
<rect width='1000' height='330' rx='20' fill='#eef6ff'/>
<text x='500.0' y='40' font-family='Trebuchet MS, Verdana, sans-serif' font-size='22' font-weight='700' fill='#1f4a72' text-anchor='middle'>Water is cardboard's real enemy: the soak meter</text>
<defs><linearGradient id='sk' x1='0' x2='1'><stop offset='0' stop-color='#d6ecff'/><stop offset='0.5' stop-color='#4aa8f0'/><stop offset='1' stop-color='#2f5fb0'/></linearGradient></defs>
<rect x='80' y='80' width='840' height='40' rx='20' fill='url(#sk)' stroke='#1f4a72' stroke-width='3'/>
<line x1='80' y1='70' x2='80' y2='130' stroke='#1f4a72' stroke-width='3'/>
<text x='80' y='150' font-family='Trebuchet MS, Verdana, sans-serif' font-size='14' font-weight='700' fill='#1f4a72' text-anchor='middle'>0  dry</text>
<line x1='500' y1='70' x2='500' y2='130' stroke='#1f4a72' stroke-width='3'/>
<text x='500' y='150' font-family='Trebuchet MS, Verdana, sans-serif' font-size='14' font-weight='700' fill='#1f4a72' text-anchor='middle'>50  soggy: takes +25% damage</text>
<line x1='920' y1='70' x2='920' y2='130' stroke='#1f4a72' stroke-width='3'/>
<text x='920' y='150' font-family='Trebuchet MS, Verdana, sans-serif' font-size='14' font-weight='700' fill='#1f4a72' text-anchor='middle'>100  FLOPPY: loses a turn</text>
<text x='500.0' y='190' font-family='Trebuchet MS, Verdana, sans-serif' font-size='14' font-weight='400' fill='#1f4a72' text-anchor='middle'>Water attacks, rainy battles and walking in the rain fill it. Reinforced armor fills it slower.</text>
<rect x='40' y='215' width='170' height='90' rx='12' fill='#fffaf0' stroke='#1f4a72' stroke-width='2'/>
<text x='125' y='243' font-family='Trebuchet MS, Verdana, sans-serif' font-size='15' font-weight='700' fill='#1f4a72' text-anchor='middle'>Barricade</text>
<text x='125' y='265' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='600' fill='#7a5434' text-anchor='middle'>3 scraps</text>
<text x='125' y='287' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>blocks 3 water hits</text>
<rect x='226' y='215' width='170' height='90' rx='12' fill='#fffaf0' stroke='#1f4a72' stroke-width='2'/>
<text x='311' y='243' font-family='Trebuchet MS, Verdana, sans-serif' font-size='15' font-weight='700' fill='#1f4a72' text-anchor='middle'>Gutter</text>
<text x='311' y='265' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='600' fill='#7a5434' text-anchor='middle'>2 scraps</text>
<text x='311' y='287' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>-60 soak, halves gain</text>
<rect x='412' y='215' width='170' height='90' rx='12' fill='#fffaf0' stroke='#1f4a72' stroke-width='2'/>
<text x='497' y='243' font-family='Trebuchet MS, Verdana, sans-serif' font-size='15' font-weight='700' fill='#1f4a72' text-anchor='middle'>Paper Parasol</text>
<text x='497' y='265' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='600' fill='#7a5434' text-anchor='middle'>Rain Shield</text>
<text x='497' y='287' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>no soak for 2 turns</text>
<rect x='598' y='215' width='170' height='90' rx='12' fill='#fffaf0' stroke='#1f4a72' stroke-width='2'/>
<text x='683' y='243' font-family='Trebuchet MS, Verdana, sans-serif' font-size='15' font-weight='700' fill='#1f4a72' text-anchor='middle'>Juice box</text>
<text x='683' y='265' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='600' fill='#7a5434' text-anchor='middle'>&amp; stands</text>
<text x='683' y='287' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>dries one friend</text>
<rect x='784' y='215' width='170' height='90' rx='12' fill='#fffaf0' stroke='#1f4a72' stroke-width='2'/>
<text x='869' y='243' font-family='Trebuchet MS, Verdana, sans-serif' font-size='15' font-weight='700' fill='#1f4a72' text-anchor='middle'>Campfire</text>
<text x='869' y='265' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='600' fill='#7a5434' text-anchor='middle'>rest + save</text>
<text x='869' y='287' font-family='Trebuchet MS, Verdana, sans-serif' font-size='12' font-weight='400' fill='#3d2412' text-anchor='middle'>dries everyone</text>
</svg>